name: brd4-md
channels: [conda-forge]
dependencies:
  - python=3.11
  - openmm
  - openff-toolkit
  - openff-nagl   # AM1-BCC-like charges; AmberTools (antechamber) has no win-64 build
  - pdbfixer
  - rdkit
  - mdanalysis
  - scikit-learn
  - matplotlib
  - nglview
  - openff-interchange
  - lxml
  - pip
  - pip:
      - openmmforcefields  # pip install --no-deps openmmforcefields after env creation: conda build needs ambertools (no win-64)
